jobs:
  ls:
    class: CommandJob
    cron: "* * * * *"
    cmd: "ls -l -a"
  
  ls_all:
    class: CommandJob
    cron: "* * * * *"
    cmd: "ls -l -a"

  outputstderr:
    class: CommandJob
    cron: "* * * * *"
    cmd: "python outputstderr.py"
  
  LongRunningJob:
    class: test_scheduler:LongRunningJob
    cron: "* * * * *"
    queue: long_running_queue
